name: build

on:
    push:
        branches:
            - "*"
    pull_request:
        branches:
            - "*"

jobs:
    test:
        if: "!contains(github.event.head_commit.message, 'skip ci')"
        runs-on: ubuntu-latest
        name: P8.4 - L13.*
        env:
            extensions: intl, json, mbstring, dom, curl, openssl, mcrypt

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Cache dependencies
                uses: actions/cache@v4
                with:
                    path: ~/.composer/cache/files
                    key: dependencies-laravel-13-php-8.4-composer-${{ hashFiles('composer.json') }}

            -   name: Setup PHP 8.4
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    extensions: ${{ env.extensions }}
                    tools: composer
                    coverage: none

            -   name: Setup Laravel 13
                run: |
                    composer require "laravel/framework:^13.0" "orchestra/testbench:^11.0" --no-interaction --no-update
                    composer update --prefer-stable --prefer-dist --no-interaction

            -   name: Run tests
                run: vendor/bin/phpunit -c phpunit_gt_81.xml --no-coverage
